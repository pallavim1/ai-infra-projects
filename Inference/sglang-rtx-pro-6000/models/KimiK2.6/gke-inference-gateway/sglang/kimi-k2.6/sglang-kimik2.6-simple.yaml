apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-sa
  namespace: default
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sglang-kimi-g4
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-kimi
  serviceName: "sglang-kimi"
  template:
    metadata:
      labels:
        app: sglang-kimi
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "8"
        gke-gcsfuse/memory-limit: "16Gi"
    spec:
      serviceAccountName: sglang-sa
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-nodepool: pm-8x-rtx6000-2nic-pool
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sglang-container
        image: docker.io/lmsysorg/sglang:dev-cu13
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        command: ["python3", "-m", "sglang.launch_server"]
        args:
        - --model-path=/models
        - --served-model-name=kimi-k2.6
        - --tp=8
        - --kv-cache-dtype=fp8_e4m3
        - --trust-remote-code
        - --reasoning-parser=kimi_k2
        - --tool-call-parser=kimi_k2
        - --context-length=32768
        - --chunked-prefill-size=4096
        - --max-running-requests=64
        - --mem-fraction-static=0.85
        - --attention-backend=flashinfer
        - --disable-cuda-graph
        - --host=0.0.0.0
        - --port=30000
        resources:
          limits:
            nvidia.com/gpu: "8"
          requests:
            nvidia.com/gpu: "8"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: models
        csi:
          driver: gcsfuse.csi.storage.gke.io
          readOnly: true
          volumeAttributes:
            bucketName: pallaviam-sglang-kimi-us-east5
            mountOptions: "implicit-dirs,only-dir=kimi-k2.6,file-cache:max-size-mb:0,metadata-cache:ttl-secs:-1"
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-kimi-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: sglang-kimi
  ports:
  - name: serving
    port: 30000
    targetPort: 30000
