apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-chat-app-config
  namespace: default
data:
  app.py: |
    import os
    import sys
    import time
    from openai import OpenAI

    VLLM_API_URL = os.getenv("VLLM_API_URL", "http://vllm-kimi-service:30000/v1")

    client = OpenAI(
        base_url=VLLM_API_URL,
        api_key="token-not-required"
    )

    def test_connection():
        print("=" * 60)
        print(f"Connecting to vLLM server at: {VLLM_API_URL}")
        print("Waiting for server to start up and load weights...")
        print("=" * 60)
        
        max_attempts = 60
        attempt = 0
        while attempt < max_attempts:
            attempt += 1
            try:
                response = client.chat.completions.create(
                    model="/models",
                    messages=[{"role": "user", "content": "Hello! Tell me a one-sentence joke to verify connection."}],
                    stream=True,
                    max_tokens=100,
                )
                sys.stdout.write("Kimi: ")
                sys.stdout.flush()
                for chunk in response:
                    if chunk.choices[0].delta.content:
                        sys.stdout.write(chunk.choices[0].delta.content)
                        sys.stdout.flush()
                print("\n" + "=" * 60)
                print("Connection test successful!")
                print("=" * 60)
                return
            except Exception as e:
                print(f"Attempt {attempt}/{max_attempts}: vLLM server not ready yet ({e}). Retrying in 15 seconds...")
                time.sleep(15)
                
        print(f"\n[ERROR] Failed to connect to vLLM server after {max_attempts} attempts.", file=sys.stderr)
        sys.exit(1)

    if __name__ == "__main__":
        test_connection()
        print("\nKeeping the verification pod running for benchmarks...")
        try:
            while True:
                time.sleep(3600)
        except KeyboardInterrupt:
            print("\nExiting.")
---
apiVersion: v1
kind: Pod
metadata:
  name: vllm-chat-app-pod
  namespace: default
  labels:
    app: vllm-chat-app
spec:
  restartPolicy: Never
  containers:
  - name: chat-app-container
    image: python:3.11-slim
    command: ["/bin/sh", "-c"]
    args:
    - |
      pip install --no-cache-dir openai && python3 -u /app/app.py
    env:
    - name: VLLM_API_URL
      value: "http://vllm-kimi-service:30000/v1"
    - name: PYTHONUNBUFFERED
      value: "1"
    volumeMounts:
    - name: app-code
      mountPath: /app/app.py
      subPath: app.py
  volumes:
  - name: app-code
    configMap:
      name: vllm-chat-app-config
