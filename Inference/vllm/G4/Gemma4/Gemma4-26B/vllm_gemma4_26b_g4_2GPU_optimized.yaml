apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4-2gpu-service
  namespace: default
  labels:
    app: vllm-gemma4-2gpu
spec:
  type: ClusterIP
  selector:
    app: vllm-gemma4-2gpu
  ports:
  - name: http-serving
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-gemma4-1node-2gpu
  namespace: default
  labels:
    app: vllm-gemma4-2gpu
spec:
  replicas: 1
  serviceName: "vllm-gemma4-2gpu-service"
  selector:
    matchLabels:
      app: vllm-gemma4-2gpu
  template:
    metadata:
      labels:
        app: vllm-gemma4-2gpu
    spec:
      serviceAccountName: vllm-gemma4-sa
      nodeSelector:
        cloud.google.com/gke-nodepool: pm-8x-rtx6000-2nic-pool
        kubernetes.io/hostname: gke-pm-g4-sglang-clu-pm-8x-rtx6000-2n-c042ebad-58nv
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --host=0.0.0.0
        - --port=8000
        - --seed=42
        - --model=google/gemma-4-26B-A4B
        - --served-model-name=google/gemma-4-26B-A4B
        - --tensor-parallel-size=2
        - --enable-expert-parallel
        - --disable-custom-all-reduce
        - --max-model-len=16384
        - --max-num-seqs=32
        - --enable-chunked-prefill
        - --max-num-batched-tokens=32768
        - --limit-mm-per-prompt={"image":0,"video":0,"audio":0}
        - --no-enable-prefix-caching
        - --quantization=fp8
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.92
        - --compilation-config={"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,12,16,24,32]}
        - --async-scheduling
        - --block-size=16
        - --trust-remote-code
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OMP_NUM_THREADS
          value: "16"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        resources:
          limits:
            nvidia.com/gpu: "2"
            memory: 128Gi
            cpu: "32"
          requests:
            nvidia.com/gpu: "2"
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/hf-cache
          type: DirectoryOrCreate
