apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma4-26b
  namespace: default
  labels:
    app: vllm-gemma4-26b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-gemma4-26b
  template:
    metadata:
      labels:
        app: vllm-gemma4-26b
    spec:
      containers:
      - name: vllm-server
        image: vllm/vllm-openai:latest
        imagePullPolicy: Always
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - --host=0.0.0.0
        - --port=8000
        - --seed=42
        - --model=google/gemma-4-26B-A4B
        - --max-model-len=16384
        - --max-num-seqs=1024
        - --tensor-parallel-size=1
        - --max-num-batched-tokens=16384
        - --no-enable-prefix-caching
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.9
        - --async-scheduling
        - "--limit-mm-per-prompt={\"image\": 1, \"video\": 0, \"audio\": 0}"
        - --block-size=256
        - "--additional-config={\"quantization\": { \"qwix\": { \"rules\": [{ \"module_path\": \".*\", \"weight_qtype\": \"float8_e4m3fn\", \"act_qtype\": \"float8_e4m3fn\"}]}}}"
        - --trust-remote-code
        - --enforce-eager
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        ports:
        - containerPort: 8000
