apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4-h100-service
  namespace: default
spec:
  selector:
    app: vllm-gemma4-h100-2gpu
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-gemma4-1node-2gpu
  namespace: default
spec:
  serviceName: "vllm-gemma4-h100-service"
  replicas: 1
  selector:
    matchLabels:
      app: vllm-gemma4-h100-2gpu
  template:
    metadata:
      labels:
        app: vllm-gemma4-h100-2gpu
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: pallaviam-h100-tcpx-pool
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: vllm-server
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Preparing clean NVIDIA driver libs without host TCPXO libnccl-net.so and libnccl-tuner.so ==="
              mkdir -p /tmp/nvidia-libs
              cp -a /usr/local/nvidia/lib64/* /tmp/nvidia-libs/ || true
              rm -f /tmp/nvidia-libs/libnccl-net.so* /tmp/nvidia-libs/libnccl-tuner.so*
              export LD_LIBRARY_PATH="/tmp/nvidia-libs:/usr/local/cuda/lib64"
              export NCCL_NET="Socket"
              export NCCL_TUNER_PLUGIN="none"
              echo "=== Launching vLLM server for google/gemma-4-26B-A4B on 2x H100 GPUs (TP=2) ==="
              python3 -m vllm.entrypoints.openai.api_server \
                --model google/gemma-4-26B-A4B \
                --host 0.0.0.0 \
                --port 8000 \
                --seed 42 \
                --tensor-parallel-size 2 \
                --quantization fp8 \
                --max-model-len 16384 \
                --max-num-seqs 1024 \
                --max-num-batched-tokens 16384 \
                --kv-cache-dtype fp8 \
                --gpu-memory-utilization 0.90 \
                --limit-mm-per-prompt '{"image": 0, "video": 0, "audio": 0}' \
                --attention-config '{"backend": "TRITON_ATTN"}' \
                --enable-prefix-caching \
                --enable-chunked-prefill \
                --disable-custom-all-reduce \
                --trust-remote-code \
                --enforce-eager
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: VLLM_USE_V1
              value: "1"
            - name: VLLM_ATTENTION_BACKEND
              value: "TRITON_ATTN"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_NET_PLUGIN
              value: "none"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "24"
              memory: "160Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "32"
              memory: "200Gi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: hf-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-disks/hf-cache
            type: DirectoryOrCreate
